name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Names
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/silo-newsletter" >>"$GITHUB_OUTPUT"
          echo "version=0.1.0-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: silo-newsletter:smoke
          build-args: VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm silo-newsletter:smoke help | grep -q "Silo Newsletter"
          if docker run --rm -e SILO_URL=http://127.0.0.1:9 -e SILO_API_KEY=x silo-newsletter:smoke verify; then exit 1; fi
          # A root-owned data folder is handed to 99:100 and the app keeps running.
          mkdir data && sudo chown root:root data && sudo chmod 700 data
          docker run -d --name smoke -v "$PWD/data:/data" silo-newsletter:smoke
          sleep 3
          docker logs smoke
          test "$(docker inspect -f {{.State.Running}} smoke)" = true
          test "$(sudo stat -c %u:%g data)" = 99:100
          test "$(ps -o uid= -p "$(docker inspect -f {{.State.Pid}} smoke)" | tr -d " ")" = 99
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push amd64 + arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha
